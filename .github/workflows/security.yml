name: Tests and dependency audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # every Monday, to catch new advisories for pinned versions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
      - name: Known vulnerabilities in the pinned dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Tests
        run: python -m unittest
