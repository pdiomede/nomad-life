  <style>
    /* Standalone on purpose: works when served by Flask or by any web server. */
    :root { --bg: #F1F1F3; --surface: #FFFFFF; --text: #303549; --muted: #62677B; --border: #EAEBEF;
            --primary: #383D51; --primary-text: #FFFFFF; --link: #A13A8C; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #1B2030; --surface: #292E41; --text: #F1F1F3; --muted: #A5A8B6;
            --border: #383D51; --primary: #F1F1F3; --primary-text: #1B2030; --link: #E58FD1; color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1B2030; --surface: #292E41; --text: #F1F1F3; --muted: #A5A8B6;
            --border: #383D51; --primary: #F1F1F3; --primary-text: #1B2030; --link: #E58FD1; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--text); text-align: center;
           font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 520px; }
    .code { display: flex; align-items: center; justify-content: center; gap: 6px;
            font-family: "Outfit", "Inter", system-ui, sans-serif; font-weight: 700; font-size: 120px; line-height: 1; }
    .code img { width: 80px; height: 96px; animation: wander 3s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes wander { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .code img { animation: none; transform: rotate(-12deg); } }
    h1 { font-family: "Outfit", "Inter", system-ui, sans-serif; font-size: 32px; margin: 20px 0 8px; }
    p { margin: 0 0 8px; color: var(--muted); font-size: 17px; }
    .stats { display: inline-block; margin: 12px 0 28px; padding: 8px 14px; border-radius: 999px; font-size: 14px;
             background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 11px 20px; border-radius: 6px; font-weight: 600; font-size: 15px;
           text-decoration: none; border: 1px solid transparent; }
    .btn-primary { background: var(--primary); color: var(--primary-text); }
    .btn-ghost { color: var(--text); border-color: var(--border); background: var(--surface); }
    .btn:hover { opacity: 0.88; }
    footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--link); text-decoration: none; }
    @media (max-width: 420px) { .code { font-size: 88px; } .code img { width: 60px; height: 72px; } h1 { font-size: 26px; } }
  </style>
