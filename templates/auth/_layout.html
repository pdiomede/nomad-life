{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-head">
      <img class="brand-logo lg" src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="Nomad Life" width="47" height="56">
      <h1>{% block heading %}{% endblock %}</h1>
      <p class="muted">{% block sub %}{% endblock %}</p>
    </div>
    {% block form %}{% endblock %}
  </div>
</div>
{% endblock %}
