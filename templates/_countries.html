{# Country picker data. Inputs with data-country-combo become a searchable list with flags
   (static/js/theme.js); without JavaScript the native datalist below still offers suggestions. #}
<datalist id="country-list">
  {% for c in countries %}<option value="{{ c }}">{% endfor %}
</datalist>
<script type="application/json" id="country-data">{{ country_data | tojson }}</script>
{# The account's favorite countries (the star in the list), and where to save them. #}
<script type="application/json" id="country-favorites" data-url="{{ url_for('favorite_country') }}" data-csrf="{{ csrf_token() }}">{{ favorite_countries() | tojson }}</script>
